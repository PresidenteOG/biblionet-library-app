name: CI

# Builds the debug APK on every push and PR. Firebase is not reachable from
# CI, so the build uses the redacted google-services.json.example — the
# Google Services plugin only checks the file's shape and package name, which
# is enough to compile.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Provide a placeholder google-services.json
        run: cp app/google-services.json.example app/google-services.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
